<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GT Seat Notifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #B3A369;
      --navy: #003057;
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #ddd;
      --green: #2e7d32;
      --yellow: #f9a825;
      --gray: #9e9e9e;
      --red: #c62828;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #222;
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 22px; font-weight: 700; color: var(--gold); }
    header .sub  { font-size: 13px; opacity: .7; }

    main { max-width: 860px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--navy); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #444; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--navy); }

    .courses-input { display: flex; gap: 8px; margin-bottom: 8px; }
    .courses-input input { flex: 1; }
    #course-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
    .tag {
      background: var(--navy); color: white; border-radius: 4px;
      padding: 2px 8px; font-size: 13px; display: flex; align-items: center; gap: 4px;
    }
    .tag button {
      background: none; border: none; color: white; cursor: pointer;
      font-size: 15px; line-height: 1; padding: 0; width: auto;
    }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button {
      padding: 9px 20px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-danger  { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .85; }

    #status-bar {
      padding: 10px 16px; border-radius: 6px; font-size: 13px;
      margin-bottom: 24px; display: none;
    }
    #status-bar.info    { background: #e3f2fd; color: #0d47a1; }
    #status-bar.success { background: #e8f5e9; color: #1b5e20; }
    #status-bar.error   { background: #ffebee; color: #b71c1c; }

    #dashboard { display: none; }
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .dash-header h2 { font-size: 16px; font-weight: 600; color: var(--navy); }
    .pulse {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: var(--green); margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    .course-block { margin-bottom: 20px; }
    .course-block h3 {
      font-size: 14px; font-weight: 600; color: var(--navy);
      margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 6px 10px; background: #f0f0f0;
      color: #555; font-weight: 600; white-space: nowrap;
    }
    td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .badge-open     { background: #e8f5e9; color: var(--green); }
    .badge-waitlist { background: #fff8e1; color: var(--yellow); }
    .badge-full     { background: #f5f5f5; color: var(--gray); }
    .badge-pending  { background: #e3f2fd; color: #1565c0; }

    .warn-list { font-size: 13px; color: #b45309; margin-top: 8px; }
    .warn-list li { list-style: none; padding: 2px 0; }
    .warn-list li::before { content: "⚠ "; }

    #last-update { font-size: 12px; color: var(--gray); }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">GT Seat Notifier</div>
    <div class="sub">Georgia Tech — Course Availability Monitor</div>
  </div>
</header>

<main>
  <div id="status-bar"></div>

  <div class="card" id="config-card">
    <h2>Setup</h2>

    <div class="grid-2" style="margin-bottom:12px">
      <div>
        <label for="inp-name">Your Name (optional)</label>
        <input id="inp-name" type="text" placeholder="e.g. João Silva" />
      </div>
      <div>
        <label for="inp-major">Major (optional)</label>
        <input id="inp-major" type="text" placeholder="e.g. Computer Engineering" />
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:12px">
      <div>
        <label for="inp-topic">ntfy Topic <span style="color:red">*</span></label>
        <input id="inp-topic" type="text" placeholder="e.g. gt-alerts-joao" />
      </div>
      <div>
        <label for="inp-term">Term Code <span style="color:red">*</span></label>
        <input id="inp-term" type="text" placeholder="e.g. 202608 (Fall 2026)" value="202608" />
      </div>
    </div>

    <div style="margin-bottom:12px">
      <label>Courses <span style="color:red">*</span></label>
      <div class="courses-input">
        <input id="inp-course" type="text" placeholder="e.g. CS 1332 — press Enter or Add" />
        <button class="btn-primary" onclick="addCourse()" style="white-space:nowrap">Add</button>
      </div>
      <div id="course-tags"></div>
    </div>

    <div class="grid-2" style="margin-bottom:4px">
      <div>
        <label for="inp-server">ntfy Server</label>
        <input id="inp-server" type="text" value="https://ntfy.sh" />
      </div>
      <div>
        <label for="inp-interval">Check Interval (seconds)</label>
        <input id="inp-interval" type="number" value="60" min="15" />
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-start" onclick="startMonitor()">Start Monitoring</button>
      <button class="btn-danger"  id="btn-stop"  onclick="stopMonitor()" style="display:none">Stop</button>
    </div>
  </div>

  <div id="dashboard">
    <div class="dash-header">
      <h2><span class="pulse"></span>Live Dashboard</h2>
      <span id="last-update"></span>
    </div>
    <div id="courses-container"></div>
  </div>
</main>

<script>
  const API = "http://localhost:8080";
  let courses = [];
  let pollTimer = null;

  // Restore saved courses from localStorage
  (function init() {
    const saved = localStorage.getItem("gt-courses");
    if (saved) { try { courses = JSON.parse(saved); renderTags(); } catch(_) {} }
    const savedTopic   = localStorage.getItem("gt-topic");
    const savedTerm    = localStorage.getItem("gt-term");
    const savedServer  = localStorage.getItem("gt-server");
    const savedInterval = localStorage.getItem("gt-interval");
    if (savedTopic)   document.getElementById("inp-topic").value   = savedTopic;
    if (savedTerm)    document.getElementById("inp-term").value    = savedTerm;
    if (savedServer)  document.getElementById("inp-server").value  = savedServer;
    if (savedInterval) document.getElementById("inp-interval").value = savedInterval;
  })();

  function savePrefs() {
    localStorage.setItem("gt-courses",  JSON.stringify(courses));
    localStorage.setItem("gt-topic",    document.getElementById("inp-topic").value);
    localStorage.setItem("gt-term",     document.getElementById("inp-term").value);
    localStorage.setItem("gt-server",   document.getElementById("inp-server").value);
    localStorage.setItem("gt-interval", document.getElementById("inp-interval").value);
  }

  // Course tags
  document.getElementById("inp-course").addEventListener("keydown", e => {
    if (e.key === "Enter") addCourse();
  });

  function addCourse() {
    const val = document.getElementById("inp-course").value.trim().toUpperCase();
    if (!val || courses.includes(val)) return;
    courses.push(val);
    document.getElementById("inp-course").value = "";
    renderTags();
    savePrefs();
  }

  function removeCourse(c) {
    courses = courses.filter(x => x !== c);
    renderTags();
    savePrefs();
  }

  function renderTags() {
    const el = document.getElementById("course-tags");
    el.innerHTML = courses.map(c =>
      `<span class="tag">${c}<button onclick="removeCourse('${c}')" title="Remove">×</button></span>`
    ).join("");
  }

  // Status bar
  function showStatus(msg, type = "info") {
    const el = document.getElementById("status-bar");
    el.textContent = msg;
    el.className = type;
    el.style.display = "block";
  }
  function hideStatus() {
    document.getElementById("status-bar").style.display = "none";
  }

  // Start
  async function startMonitor() {
    const ntfy_topic = document.getElementById("inp-topic").value.trim();
    const term       = document.getElementById("inp-term").value.trim();
    if (!ntfy_topic) { showStatus("ntfy topic is required.", "error"); return; }
    if (!term)       { showStatus("Term code is required.", "error"); return; }
    if (!courses.length) { showStatus("Add at least one course.", "error"); return; }

    savePrefs();
    document.getElementById("btn-start").disabled = true;
    showStatus("Discovering sections…", "info");

    try {
      const res = await fetch(`${API}/api/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name:        document.getElementById("inp-name").value.trim(),
          major:       document.getElementById("inp-major").value.trim(),
          ntfy_topic,
          ntfy_server: document.getElementById("inp-server").value.trim(),
          term,
          courses,
          interval:    parseInt(document.getElementById("inp-interval").value) || 60,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        showStatus(data.error || "Error starting monitor.", "error");
        document.getElementById("btn-start").disabled = false;
        return;
      }

      let msg = `Monitoring ${data.sections_found} section(s).`;
      if (data.warnings?.length) msg += ` ⚠ ${data.warnings.join(" | ")}`;
      showStatus(msg, "success");

      document.getElementById("btn-start").style.display = "none";
      document.getElementById("btn-stop").style.display  = "";
      document.getElementById("dashboard").style.display = "block";

      startPolling();
    } catch (err) {
      showStatus("Cannot reach backend. Is it running? (python app.py)", "error");
      document.getElementById("btn-start").disabled = false;
    }
  }

  // Stop
  async function stopMonitor() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    try { await fetch(`${API}/api/stop`, { method: "POST" }); } catch(_) {}
    document.getElementById("btn-stop").style.display  = "none";
    document.getElementById("btn-start").style.display = "";
    document.getElementById("btn-start").disabled = false;
    document.getElementById("dashboard").style.display = "none";
    showStatus("Monitoring stopped.", "info");
  }

  // Poll
  function startPolling() {
    fetchStatus();
    pollTimer = setInterval(fetchStatus, 5000);
  }

  async function fetchStatus() {
    try {
      const res  = await fetch(`${API}/api/status`);
      const data = await res.json();
      renderDashboard(data);
      if (!data.running) {
        showStatus("Monitor stopped unexpectedly.", "error");
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        document.getElementById("btn-stop").style.display  = "none";
        document.getElementById("btn-start").style.display = "";
        document.getElementById("btn-start").disabled = false;
      }
    } catch(_) {}
  }

  function renderDashboard(data) {
    if (data.last_update) {
      document.getElementById("last-update").textContent = `Updated ${data.last_update}`;
    }

    const container = document.getElementById("courses-container");
    const html = Object.entries(data.courses || {}).map(([courseId, sections]) => {
      const rows = sections.map(s => {
        const status = s.status || "pending";
        const badgeClass = {
          open: "badge-open", waitlist: "badge-waitlist",
          full: "badge-full",  pending: "badge-pending",
        }[status] || "badge-full";
        const badgeText = {
          open: "Open", waitlist: "Waitlist", full: "Full", pending: "…",
        }[status] || status;

        const enroll = s.enrollment_maximum
          ? `${s.enrollment_actual}/${s.enrollment_maximum}`
          : s.error || "—";
        const seats  = s.enrollment_seats_available ?? "—";
        const wl     = s.waitlist_capacity
          ? `${s.waitlist_actual}/${s.waitlist_capacity}`
          : "—";
        const wlAvail = s.waitlist_seats_available ?? "—";

        return `<tr>
          <td>${s.section_id}</td>
          <td>${s.crn}</td>
          <td>${enroll}</td>
          <td>${seats}</td>
          <td>${wl}</td>
          <td>${wlAvail}</td>
          <td><span class="badge ${badgeClass}">${badgeText}</span></td>
        </tr>`;
      }).join("");

      const courseName = sections[0]?.course_name || "";
      return `<div class="course-block card">
        <h3>${courseId} &mdash; ${courseName}</h3>
        <table>
          <thead>
            <tr>
              <th>§</th><th>CRN</th><th>Enrolled</th>
              <th>Open</th><th>Waitlist</th><th>WL Open</th><th>Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }).join("");

    container.innerHTML = html;

    if (data.warnings?.length) {
      container.innerHTML += `<ul class="warn-list">${data.warnings.map(w => `<li>${w}</li>`).join("")}</ul>`;
    }
  }
</script>
</body>
</html>
